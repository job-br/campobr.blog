    <!-- Google Discover & SEO Requirement: Large Image Preview -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <link rel="canonical" href="https://campobr.blog" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://campobr.blog/logo-512x512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Rich Results / Site Logo Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "CampoBR Futebol",
      "url": "https://campobr.blog",
      "logo": "https://campobr.blog/logo-512x512.png"
    }
    </script>
    <!-- Image CDN Acceleration Preconnects (Zero-Latency Handshake) -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://i.ibb.co" crossorigin>
    <link rel="dns-prefetch" href="https://i.ibb.co">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Instant Rendering Engine: Speculation Rules API (Chrome / Chromium 0ms Prerender) -->
    <script type="speculationrules">
    {
      "prerender": [
        {
          "source": "list",
          "urls": ["/", "/?tab=postagens", "/?tab=noticias"],
          "eagerness": "moderate"
        }
      ],
      "prefetch": [
        {
          "source": "document",
          "where": {
            "and": [
              { "href_matches": "/*" }
            ]
          },
          "eagerness": "conservative"
        }
      ]
    }
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
